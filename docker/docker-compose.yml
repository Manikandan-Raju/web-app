services:
  backend:
    image: python:3.11-slim
    container_name: backend
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_ENV=production
    command: sh -c "pip install --upgrade pip && pip install -r requirements.txt && python3 manage.py collectstatic --noinput && until python3 manage.py migrate; do sleep 2; done && python3 manage.py runserver 0.0.0.0:8000"
  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
volumes:
  postgres_data:

